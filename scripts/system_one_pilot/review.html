<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System One · проверка разметки</title>
<style>
:root{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2939;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}header{padding:20px 26px;background:#122335;color:white;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:21px;margin:0 0 5px}header p{margin:0;color:#b8cadc;font-size:13px}button,select,input,textarea{font:inherit;border:1px solid #bac6d2;border-radius:6px;padding:9px;background:white;color:#24354a}button{cursor:pointer}button:hover{border-color:#2563eb;background:#eff6ff}button:disabled{opacity:.5;cursor:wait}.primary{background:#215adb;color:white;border-color:#215adb}.primary:hover{background:#1949b5;color:white}.toolbar{padding:12px 25px;background:white;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #d7dee7}.toolbar input{flex:1;min-width:180px}main{display:grid;grid-template-columns:minmax(280px,34%) 1fr;height:calc(100vh - 160px)}aside{overflow:auto;border-right:1px solid #d7dee7;padding:16px}article{overflow:auto;padding:22px 28px;background:white}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#66758b;padding:10px 7px}td{border-top:1px solid #d7dee7;padding:12px 7px}tr[data-id]{cursor:pointer}tr.active{background:#dfebff}tr:hover{background:#edf3fc}.tag{font-size:11px;background:#e6edf6;color:#345174;padding:3px 6px;border-radius:4px;display:inline-block;margin-top:4px}h2{font-size:19px;margin:0 0 10px}h3{font-size:14px;margin:18px 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,monospace;background:#f5f7fa;border:1px solid #e0e6ee;border-radius:6px;padding:14px;margin:6px 0}details{margin:12px 0}summary{cursor:pointer;color:#45607d}label{font-size:13px;color:#52647b;display:block;margin:12px 0 5px}textarea{width:100%;min-height:80px}.labels{display:flex;gap:8px;flex-wrap:wrap}.labels button.selected{background:#dbeafe;box-shadow:0 0 0 2px #2563eb}.meta{font-size:12px;color:#66758b;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:1px solid #cdd8e6;padding:12px;border-radius:8px}.answer pre{font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.status{min-height:25px;color:#187345;font-size:13px}.error{background:#fff0ec;color:#a92a15;padding:12px;border-radius:5px;position:sticky;top:0;z-index:3}.warning{padding:12px;background:#fff8df;border-left:3px solid #e5b236;font-size:13px;line-height:1.5}.muted{color:#66758b;font-size:13px}.empty{padding:40px;text-align:center;color:#66758b}#saveStatus{font-weight:600}#progress{font-size:13px;text-align:right}.hold{color:#9b2c13}
@media(max-width:850px){main{height:auto;display:block}aside{max-height:300px;border-bottom:1px solid #ccc}article{overflow:visible}.answers{grid-template-columns:1fr}header{align-items:flex-start}article{padding:18px}}
</style>
<header><div><h1>System One · проверка разметки</h1><p>Разметка DeepSeek + Qwen3.8 · спорные случаи разбирает агент</p></div><div id="progress">Загрузка…</div></header>
<div class="toolbar"><select id="filter" aria-label="Тип очереди"><option value="required">Требуют проверки</option><option value="all">Все карточки</option><option value="conflict">Расхождения</option><option value="uncertain">Неопределённость LLM</option><option value="control">Слепой контроль</option><option value="technical_error">Технические ошибки</option><option value="model_defect">Дефекты по мнению LLM</option></select><select id="statusFilter" aria-label="Статус"><option value="pending">Незавершённые</option><option value="all">Любой статус</option><option value="accepted">Принятые моделями/агентом</option><option value="confirmed">Подтверждённые вручную</option><option value="deferred">Отложенные</option><option value="defect">Дефекты данных</option></select><input id="search" placeholder="Поиск по названию или эпизоду" aria-label="Поиск"><button id="backup">Резервная копия</button><button id="export">Экспорт JSONL</button></div>
<div id="error" role="alert" hidden></div><div id="notice" class="status" role="status" style="padding:0 25px"></div>
<main><aside><div id="queueInfo" class="muted"></div><table><thead><tr><th>Карточка / эпизод</th><th>Проверка</th></tr></thead><tbody id="queue"></tbody></table><p class="muted">Совпадения принимаются автоматически. Расхождения разбирает агент; к вам — только неразрешимые критические противоречия.</p><button id="hold">Общая ошибка моделей — остановить очередь</button></aside><article id="inspector"><div class="empty">Выберите карточку в очереди.</div></article></main>
<script>
const $=id=>document.getElementById(id), kinds={control:'Слепой контроль',agreement:'Совпадение',conflict:'Расхождение',uncertain:'Неопределённость',technical_error:'Ошибка API/формата',model_defect:'Дефект по мнению LLM'},statuses={accepted:'Принято',pending:'Ожидает',draft:'Черновик',confirmed:'Подтверждено',deferred:'Отложено',defect:'Дефект данных'},labels={useful:'Полезно',irrelevant:'Нерелевантно',uncertain:'Неясно'};
const resolutionSources={llm_consensus:'Согласие DeepSeek + Qwen3.8',agent_adjudication:'Арбитраж агента'};
let state={queue:[],session:{}},current=null,dirty=false,timer=null,saving=null,localDraft=null,moving=false;
function error(e){$('error').hidden=false;$('error').className='error';$('error').textContent='Не удалось сохранить или загрузить: '+e.message+' Переход остановлен. Попробуйте ещё раз.';if($('saveStatus'))$('saveStatus').textContent='Ошибка записи';}
function clearError(){$('error').hidden=true;}
async function api(url,body){let r=await fetch(url,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await r.json();if(!r.ok)throw Error(data.error||r.status);return data;}
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;}
function pre(parent,text){parent.append(el('pre',text));}
function detail(parent,title,text){let d=el('details');d.append(el('summary',title));pre(d,text);parent.append(d);}
function translated(text){return current?.translation?.strings?.[text];}
function bilingual(parent,source,format=text=>text){const ru=translated(source);pre(parent,format(ru??source));if(ru!==undefined)detail(parent,'Английский оригинал',source);}
function explanation(parent,a){const v=a.annotation;if(!v){parent.append(el('p',a.error==='annotation quote absent from input'?'Ошибка проверки: цитата модели отсутствует в исходном входе. Валидной метки нет.':'Техническая ошибка ответа: метка отсутствует.'));detail(parent,'Исходная ошибка проверки',a.error||a.status);return;}
parent.append(el('p','Метка: '+(labels[v.label]||v.label)),el('p','Дефект подготовки: '+(v.defect?'да':'нет')));
for(const[key,title]of [['reason','Обоснование'],['conditions','Условия применимости']]){if(v[key]){parent.append(el('h3',title));bilingual(parent,v[key]);}}
for(const q of v.quotes||[]){parent.append(el('h3','Цитата из '+(q.source==='state'?'состояния':'документа')));bilingual(parent,q.text);}}
function filtered(){return state.queue.filter(r=>($('filter').value==='all'||($('filter').value==='required'?r.required:r.kind===$('filter').value))&&($('statusFilter').value==='all'||($('statusFilter').value==='pending'?['pending','draft'].includes(r.status):r.status===$('statusFilter').value))&&((r.title+' '+(r.title_ru||'')+' '+r.episode_id).toLowerCase().includes($('search').value.toLowerCase())));}
function renderQueue(){const rows=filtered();$('queue').replaceChildren();for(const r of rows){let tr=el('tr');tr.dataset.id=r.id;if(current?.card.id===r.id)tr.className='active';let title=el('td');title.append(el('div',r.title_ru||r.title),el('div',r.episode_id+' · '+r.id.slice(0,8),'meta'),el('span',resolutionSources[r.trusted_source]||kinds[r.kind],'tag'));tr.append(title,el('td',statuses[r.status]));tr.onclick=()=>navigate(r.id);$('queue').append(tr);}let confirmed=state.queue.filter(r=>['confirmed','accepted'].includes(r.status)).length;let required=state.queue.filter(r=>r.required).length;$('queueInfo').textContent=`Показано ${rows.length} из ${state.queue.length}`;$('progress').textContent=`Принято ${confirmed} / ${state.queue.length} · вам нужно ${required}`;$('hold').textContent=state.session.hold==='yes'?'Очередь остановлена — пересмотр рубрики':'Общая ошибка моделей — остановить очередь';$('hold').className=state.session.hold==='yes'?'hold':'';}
function draft(){return {...localDraft,note:$('note').value,disposition:$('disposition').value,adopted:$('adopted').value};}
function markDirty(){dirty=true;localDraft=draft();$('saveStatus').textContent='Есть несохранённые изменения…';clearTimeout(timer);timer=setTimeout(()=>flush().catch(error),400);}
async function flush(){clearTimeout(timer);if(saving){await saving;if(dirty)return flush();return;}if(!dirty||!current)return;const saved=draft(),id=current.card.id;dirty=false;$('saveStatus').textContent='Сохранение…';saving=(async()=>{try{const value=await api('/api/act',{id,action:'draft',revision:current.review.revision,input_sha256:current.card.input_sha256,translation_bundle_sha256:current.translation?.bundle_sha256??null,draft:saved});current.review=value.review;let row=state.queue.find(r=>r.id===id);row.status=value.review.status;row.revision=value.review.revision;if(!dirty)$('saveStatus').textContent='Черновик сохранён в SQLite';renderQueue();clearError();}catch(e){dirty=true;throw e;}finally{saving=null;}})();await saving;if(dirty)return flush();}
async function persistSession(){state.session={...state.session,current:current?.card.id||'',filter:$('filter').value,status:$('statusFilter').value,search:$('search').value};await api('/api/session',state.session);}
async function navigate(id){if(moving)return;moving=true;$('inspector').inert=true;try{await flush();const value=await api('/api/card?id='+encodeURIComponent(id));const nextSession={...state.session,current:id,filter:$('filter').value,status:$('statusFilter').value,search:$('search').value};await api('/api/session',nextSession);current=value;state.session=nextSession;renderCard();renderQueue();clearError();}catch(e){error(e);}finally{moving=false;$('inspector').inert=false;}}
function renderCard(){let panel=$('inspector');panel.replaceChildren();const {card,review,kind,annotations}=current;localDraft={label:null,note:'',disposition:'decision',adopted:'independent',...review.draft};panel.append(el('div',current.trusted_resolution?resolutionSources[current.trusted_resolution.source]+' · Принято':kinds[kind]+' · '+statuses[review.status],'tag'),el('h2',translated(card.title)||card.title),el('div',`${card.episode_id} · ${card.id} · cutoff ${card.cutoff??'test'} · ${card.full_sequence_tokens??card.tokens??'?'} модельных токенов`,'meta'));
if(current.translation)panel.append(el('p','Вспомогательный перевод Codex. При неоднозначности сверяйте английский оригинал; именно его оценивали модели.','muted'));else panel.append(el('p','Русский перевод для этой версии пока не загружен. Показан английский оригинал.','warning'));
if(translated(card.title))detail(panel,'Исходное название документа',card.title);
if(current.rubric){let rubric=el('details');rubric.append(el('summary','Рубрика разметки'));bilingual(rubric,current.rubric);panel.append(rubric);}
panel.append(el('h3','Наблюдаемое состояние'));bilingual(panel,card.input.state,text=>{try{return JSON.stringify(JSON.parse(text),null,2);}catch{return text;}});panel.append(el('h3','Кандидат — документ для оценки'));bilingual(panel,card.input.candidate);
detail(panel,'Точный сериализованный вход оценщика и вопрос',current.scorer_input+'\n\nQUESTION:\n'+JSON.stringify(current.scorer_question,null,2));detail(panel,'Происхождение, версия входа и source spans',JSON.stringify({input_sha256:card.input_sha256,representation:card.representation,document_id:card.document_id,content_sha256:card.content_sha256,source_spans:card.source_spans,scorer_payload_sha256:card.scorer_payload_sha256,full_sequence_tokens:card.full_sequence_tokens,provenance:card.provenance,included_events:card.included_events,excluded_observed_events:card.excluded_observed_events},null,2));
let diagnostic=el('details');diagnostic.append(el('summary','История до cutoff — только для диагностики'),el('p','Если нужный факт виден здесь, но отсутствует во входе оценщика, отметьте дефект подготовки. Не используйте его незаметно для смены целевой метки.','warning'));pre(diagnostic,JSON.stringify(card.diagnostic_history||[],null,2));panel.append(diagnostic);
let blind=!annotations;if(blind)panel.append(el('p','Контроль совпадения: сначала выберите самостоятельную метку. Ответы моделей станут доступны после сохранения и раскрытия.','warning'));else{panel.append(el('h3','Ответы моделей — русский перевод'));let answers=el('div',undefined,'answers');for(const a of annotations){let box=el('div',undefined,'answer');box.append(el('strong',(a.model||'Тестовый разметчик').split('/').pop()));explanation(box,a);detail(box,'Полный исходный ответ API',JSON.stringify(a.raw,null,2));answers.append(box);}panel.append(answers);}
if(current.trusted_resolution){const r=current.trusted_resolution;panel.append(el('h3','Принятая разметка'),el('p','Метка: '+labels[r.annotation.label]),el('p',r.reason_ru),el('p','Источник: '+resolutionSources[r.source]+'. Ручное подтверждение не требуется.','status'));detail(panel,'Происхождение принятой метки',JSON.stringify(r,null,2));return;}
panel.append(el('h3',blind?'Ваша самостоятельная метка':'Ваше решение'));let group=el('div',undefined,'labels');for(const [key,text]of Object.entries(labels)){let b=el('button',text);b.type='button';b.dataset.label=key;b.setAttribute('aria-pressed',localDraft.label===key?'true':'false');if(localDraft.label===key)b.className='selected';b.onclick=()=>{localDraft.label=key;for(let other of group.children){other.classList.toggle('selected',other===b);other.setAttribute('aria-pressed',other===b?'true':'false');}markDirty();};group.append(b);}panel.append(group);
let disp=el('select');disp.id='disposition';for(const [key,text]of Object.entries({decision:'Метка по имеющемуся входу',deferred:'Отложить: вернуться позже',defect:'Дефект данных: нужна новая версия'})){let o=el('option',text);o.value=key;disp.append(o);}disp.value=localDraft.disposition;panel.append(el('label','Действие'));panel.lastChild.htmlFor='disposition';panel.append(disp);disp.onchange=markDirty;
let adopted=el('select');adopted.id='adopted';for(const[key,text]of Object.entries({independent:'Собственное обоснование',deepseek:'Принимаю обоснование DeepSeek',qwen:'Принимаю обоснование Qwen'})){let o=el('option',text);o.value=key;adopted.append(o);}adopted.value=localDraft.adopted;adopted.disabled=blind;panel.append(el('label','Происхождение обоснования'));panel.lastChild.htmlFor='adopted';panel.append(adopted);adopted.onchange=markDirty;
panel.append(el('label','Причина / комментарий (обязательно перед подтверждением)'));panel.lastChild.htmlFor='note';let note=el('textarea');note.id='note';note.value=localDraft.note;note.oninput=markDirty;panel.append(note);let status=el('div',review.revision?'Сохранено в SQLite':'Изменений пока нет','status');status.id='saveStatus';status.setAttribute('role','status');panel.append(status);let actions=el('div',undefined,'actions');if(blind){let reveal=el('button','Сохранить и раскрыть ответы');reveal.id='reveal';reveal.onclick=()=>mutate('reveal');actions.append(reveal);}let confirm=el('button','Подтвердить и следующая','primary');confirm.id='confirm';confirm.onclick=()=>mutate('confirm');actions.append(confirm);let save=el('button','Сохранить черновик');save.onclick=()=>flush().catch(error);actions.append(save);panel.append(actions);if(review.first_label)panel.append(el('p','Первая самостоятельная метка: '+labels[review.first_label]+'. Ответы уже раскрыты; этот факт сохранён.','muted'));detail(panel,'История сохранений и исправлений',JSON.stringify(current.history,null,2));}
async function mutate(action){if(moving)return;moving=true;$('inspector').inert=true;let nextId=null;try{await flush();current=await api('/api/act',{id:current.card.id,action,revision:current.review.revision,input_sha256:current.card.input_sha256,translation_bundle_sha256:current.translation?.bundle_sha256??null});state=(await api('/api/state'));renderCard();renderQueue();clearError();if(action==='confirm'){await api('/api/backup',{});nextId=filtered().find(r=>r.id!==current.card.id&&['pending','draft'].includes(r.status))?.id;if(!nextId)$('notice').textContent='Решение подтверждено. В выбранном фильтре больше нет незавершённых карточек.';}}catch(e){error(e);}finally{moving=false;$('inspector').inert=false;}if(nextId)await navigate(nextId);}
for(let id of ['filter','statusFilter','search'])$(id).onchange=async()=>{try{await flush();await persistSession();renderQueue();}catch(e){error(e);}};
for(let id of ['backup','export'])$(id).onclick=async()=>{try{await flush();let r=await api('/api/'+id,{});$('notice').textContent=(id==='export'?`Экспорт: ${r.accepted??r.confirmed} принятых меток. `:'Резервная копия проверена. ')+r.path;clearError();}catch(e){error(e);}};
$('hold').onclick=async()=>{try{await flush();state.session.hold='yes';await persistSession();renderQueue();$('notice').textContent='Подтверждение решений остановлено. Отметьте причину дефекта; пересмотр рубрики требует новой версии разметки.';}catch(e){error(e);}};
window.addEventListener('beforeunload',e=>{if(dirty||saving){e.preventDefault();e.returnValue='Есть несохранённые изменения';}});
(async()=>{try{state=await api('/api/state');$('filter').value=state.session.filter||'required';$('statusFilter').value=state.session.status||'pending';$('search').value=state.session.search||'';renderQueue();let id=state.session.current||filtered()[0]?.id;if(id)await navigate(id);}catch(e){error(e);}})();
</script></html>

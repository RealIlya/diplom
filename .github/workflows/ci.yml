name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-docs.txt -r requirements-tools.txt yamllint==1.38.0
      - run: python -m yamllint .github/workflows/ci.yml mkdocs.yml openspec/config.yaml .yamllint.yml
      - run: >-
          npm exec --yes --package=markdownlint-cli2@0.23.2 --
          markdownlint-cli2 README.md AGENTS.md 'docs/**/*.md'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_presentations.py
      - run: python scripts/check_site.py
